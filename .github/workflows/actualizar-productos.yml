name: Actualizar productos desde CSV

on:
  push:
    branches: [main]
    paths:
      - "data-source/csv/**.csv"

permissions:
  contents: write

jobs:
  actualizar-json:
    runs-on: ubuntu-latest
    # Evita que el propio commit del bot vuelva a disparar este workflow
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar productos.json desde el CSV
        run: python scripts/generar_productos.py

      - name: Commitear el JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/productos.json
          if git diff --cached --quiet; then
            echo "productos.json no cambió, nada para commitear."
          else
            git commit -m "Actualiza productos.json desde el CSV subido a data-source/csv"
            git push
          fi
