name: Build y despliegue a cPanel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de Python
        run: pip install -r scripts/requirements.txt

      - name: Generar productos.json desde el CSV
        run: python scripts/generar_productos.py

      - name: Commitear productos.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/productos.json
          if git diff --cached --quiet; then
            echo "productos.json no cambió, nada para commitear."
          else
            git commit -m "Actualiza productos.json desde el CSV en data-source/csv"
            git push
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el sitio (build)
        run: npm run build
        env:
          PUBLIC_WHATSAPP_NUMBER: ${{ secrets.PUBLIC_WHATSAPP_NUMBER }}
          PUBLIC_EMPRESA_NOMBRE: ${{ secrets.PUBLIC_EMPRESA_NOMBRE }}

      - name: Subir por FTP a cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
